[workspace]

[package]
name = "orchestrator-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
clap = { version = "4.6.1", features = ["derive", "env"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "time", "process", "net", "sync"] }
serde_json = "1.0.150"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.32"
async-trait = "0.1.89"

[dev-dependencies]
orchestrator = { path = "../orchestrator" }
tempfile = "3.27.0"
