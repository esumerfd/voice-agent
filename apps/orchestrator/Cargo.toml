[workspace]

[package]
name = "orchestrator"
version = "0.1.2"
edition = "2021"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestratord"
path = "src/bin/orchestratord.rs"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-util = "0.3.32"
gray_matter = "0.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shared = { path = "../shared" }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "time", "process", "net", "sync", "io-util"] }
tokio-tungstenite = "0.30.0"
walkdir = "2.5.0"
yaml_serde = "0.10.4"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "time", "process", "net", "sync", "io-util"] }
